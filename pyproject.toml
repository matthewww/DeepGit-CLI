[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgit"
version = "0.1.0"
description = "Deep semantic GitHub repository search — lean CLI edition for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "toml>=0.10.2",
    "requests==2.32.3",
    "numpy>=1.26.0,<2.0",
    "python-dotenv==1.0.1",
    "sentence-transformers==3.4.1",
    "faiss-cpu==1.9.0.post1",
    "pydantic==2.10.6",
    "httpx==0.27.2",
    "langgraph==0.2.62",
    "langchain_core==0.3.80",
    "rank_bm25==0.2.2",
    "langchain-anthropic<1.0",
    "langchain-openai>=0.1",
    "truststore",
]

[project.scripts]
deepgit = "cli:main"

[tool.setuptools]
py-modules = ["cli", "agent"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
